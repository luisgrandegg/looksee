name: E2E (lost-pixel against example/)

on:
  pull_request:
  push:
    branches: [main]

# These jobs run lost-pixel against example/ end-to-end. They run the Action's
# constituent steps directly (install + Playwright + storybook build + lost-pixel)
# rather than nesting the composite Action under another setup-node. Bootstrapping
# baselines on the same Linux runner where the test runs keeps screenshots
# byte-deterministic for the duration of the job.
jobs:
  green:
    name: Green — no visual change, expects pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: example
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        working-directory: example
        run: npm run build-storybook

      - name: Generate baselines
        working-directory: example
        run: npx lost-pixel update

      - name: Run lost-pixel against just-generated baselines (expects pass)
        working-directory: example
        run: npx lost-pixel

      - name: List baselines on success
        working-directory: example
        run: ls -la .lost-pixel/baseline | head -20

  red:
    name: Red — inject visual change after baselines, expects fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: example
        run: npx playwright install --with-deps chromium

      - name: Build Storybook (unmodified)
        working-directory: example
        run: npm run build-storybook

      - name: Generate baselines from unmodified example/
        working-directory: example
        run: npx lost-pixel update

      - name: Inject deterministic visual change into a story
        # NEVER commit this change. The 'Click me' label lives in the story's
        # default args, not in Button.tsx — so we sed the .stories.tsx file.
        run: |
          set -euxo pipefail
          sed -i "s/Click me/CLICK!!!/g" example/src/Button.stories.tsx
          if git diff --quiet example/src/Button.stories.tsx; then
            echo "❌ sed did not change anything — the e2e test cannot detect a regression."
            exit 1
          fi
          echo "✅ Story modified."

      - name: Re-build Storybook with the change
        working-directory: example
        run: npm run build-storybook

      - name: Run lost-pixel (expected to fail)
        id: vr
        working-directory: example
        continue-on-error: true
        run: npx lost-pixel

      - name: Upload diff artifact
        if: steps.vr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lost-pixel-diff-red-${{ github.run_id }}
          path: |
            example/.lost-pixel/difference/
            example/.lost-pixel/current/
          retention-days: 7
          if-no-files-found: ignore

      - name: Assert lost-pixel detected the regression
        run: |
          if [ "${{ steps.vr.outcome }}" = "failure" ]; then
            echo "✅ Expected: lost-pixel detected the injected regression."
            exit 0
          fi
          echo "❌ Expected lost-pixel to fail on the injected change, but it passed."
          exit 1

name: E2E (Action against example/)

on:
  pull_request:
  push:
    branches: [main]

# Each job bootstraps baselines once on the runner before invoking the Action.
# We don't commit baselines to the repo because they would not match the runner's
# rendering byte-for-byte. Bootstrapping in the same Linux environment that the
# Action runs in keeps them deterministic for the duration of the job.
jobs:
  green:
    name: Green — no visual change, expects pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap baselines for example/
        working-directory: example
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build-storybook
          npx lost-pixel update
          ls .lost-pixel/baseline | head

      - name: Run looksee against unmodified example/
        uses: ./
        with:
          working-directory: example
          comment-on-pr: 'false' # don't spam PRs from the e2e job

  red:
    name: Red — inject visual change at runtime, expects fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap baselines from the unmodified example/
        # Bootstrap BEFORE injecting the change, so baselines reflect the
        # original Button text. After injection, the action's lost-pixel run
        # will see a real diff and fail — that's what this job verifies.
        working-directory: example
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build-storybook
          npx lost-pixel update

      - name: Inject deterministic visual change into a story
        # NEVER commit this change. Constitution principle 9: keep determinism real.
        # The 'Click me' label lives in the story's default args, not in Button.tsx.
        run: |
          set -euxo pipefail
          sed -i "s/Click me/CLICK!!!/g" example/src/Button.stories.tsx
          git diff --stat example/src/Button.stories.tsx
          # Sanity-check that we actually mutated something.
          if ! git diff --quiet example/src/Button.stories.tsx; then
            echo "✅ Story modified; lost-pixel should now find a diff."
          else
            echo "❌ sed did not change anything — the e2e test cannot detect a regression."
            exit 1
          fi

      - name: Run looksee against modified example/ (expected to fail)
        id: action
        continue-on-error: true
        uses: ./
        with:
          working-directory: example
          comment-on-pr: 'false'

      - name: Assert action failed as expected
        run: |
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "✅ Expected: lost-pixel detected the injected regression."
            exit 0
          fi
          echo "❌ Expected the action to fail on the injected change, but it did not."
          exit 1

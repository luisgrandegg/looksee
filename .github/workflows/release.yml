name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "❌ Tag ($TAG) does not match package.json version (v$PKG_VERSION)."
            exit 1
          fi
          echo "✅ Tag matches package.json: $TAG"

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build CLI
        run: npm run build

      - name: Verify CLI–Action contract
        # Templates must use the <action-version> placeholder, not a hardcoded
        # ref. action.yml inputs must match what the consumer template references.
        # This is the release-time analog of /verify-templates.
        run: |
          set -euo pipefail
          if ! grep -q '<action-version>' src/templates/visual-regression.yml; then
            echo "❌ src/templates/visual-regression.yml does not contain the <action-version> placeholder."
            exit 1
          fi
          if ! grep -q "uses: luisgrandegg/looksee@v" example/.github/workflows/visual-regression.yml; then
            echo "❌ example/ workflow does not pin a major tag."
            exit 1
          fi
          PKG_MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          EXPECTED="luisgrandegg/looksee@v$PKG_MAJOR"
          if ! grep -q "$EXPECTED" example/.github/workflows/visual-regression.yml; then
            echo "❌ example/ workflow does not reference $EXPECTED."
            exit 1
          fi
          echo "✅ CLI–Action contract is consistent."

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes

      - name: Move floating major tag (vN → this commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR="v$(echo "$TAG" | sed 's/^v//' | cut -d. -f1)"
          git config user.email "release@looksee"
          git config user.name "looksee release"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "$MAJOR"
          echo "✅ Floating tag $MAJOR now points at $GITHUB_SHA"

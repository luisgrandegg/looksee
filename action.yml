name: looksee
description: Self-hosted visual regression testing for Storybook. Runs lost-pixel against a built Storybook and posts the diff on PR failure.
author: Luis Grande
branding:
  icon: eye
  color: blue

inputs:
  node-version:
    description: Node.js version to install for the consumer's build.
    required: false
    default: '20'
  storybook-build-script:
    description: npm script that builds Storybook (in the consumer's package.json).
    required: false
    default: build-storybook
  storybook-output-dir:
    description: Directory where Storybook builds to (relative to working-directory).
    required: false
    default: storybook-static
  working-directory:
    description: Subdirectory to run from. Useful for monorepos where Storybook lives in apps/web etc.
    required: false
    default: '.'
  comment-on-pr:
    description: Post a sticky PR comment when the run fails. No-op outside pull_request events.
    required: false
    default: 'true'
  artifact-retention-days:
    description: How long to keep the diff artifact uploaded on failure.
    required: false
    default: '14'

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Detect package manager
      id: pm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f pnpm-lock.yaml ]; then
          echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
        elif [ -f yarn.lock ]; then
          echo "manager=yarn" >> "$GITHUB_OUTPUT"
          echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
        else
          echo "manager=npm" >> "$GITHUB_OUTPUT"
          echo "install=npm ci" >> "$GITHUB_OUTPUT"
        fi
        echo "Using: $(grep '^install=' \"$GITHUB_OUTPUT\")"

    - name: Enable corepack (yarn / pnpm)
      if: steps.pm.outputs.manager != 'npm'
      shell: bash
      run: corepack enable

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ steps.pm.outputs.install }}

    - name: Install Playwright Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    - name: Build Storybook
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        case "${{ steps.pm.outputs.manager }}" in
          npm)  npm run ${{ inputs.storybook-build-script }} ;;
          yarn) yarn ${{ inputs.storybook-build-script }} ;;
          pnpm) pnpm ${{ inputs.storybook-build-script }} ;;
        esac

    - name: Run lost-pixel
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx lost-pixel

    - name: Upload diff artifact on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: lost-pixel-diff-${{ github.run_id }}
        path: |
          ${{ inputs.working-directory }}/.lost-pixel/difference/
          ${{ inputs.working-directory }}/.lost-pixel/current/
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: ignore

    - name: Post PR comment on failure
      if: failure() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: looksee-visual-regression
        message: |
          ## ❌ Visual regression detected

          Lost Pixel found visual differences in this PR.

          - **Run:** [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Diff artifact:** download `lost-pixel-diff-${{ github.run_id }}` from the run summary above and inspect `difference/` to see what changed.

          If the change is intentional, regenerate baselines locally with:

          ```sh
          npm run vr:baselines
          git add .lost-pixel/baseline && git commit -m 'chore(vr): update baselines' && git push
          ```

          If the change is **not** intentional, fix the underlying regression and push again — this comment will update automatically when the next CI run finishes.

          ---
          _Posted by [looksee](https://github.com/luisgrandegg/looksee)_
